name: Game feedback
description: Report a problem or a word that needs review.
title: "[Playtest] "
body:
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown at the bottom of the game library.
      placeholder: Version 1.3.0 (build 5)
  - type: dropdown
    id: game
    attributes:
      label: Game or screen
      options:
        - Bujho (Guess the Word)
        - Khoj (Word Search)
        - Chardi Kala (Word Quest)
        - Dictionary
        - Game library or loading
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: For example, Chrome on Windows or Safari on iPhone
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the language, word or definition if relevant, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we try it?
      description: Steps to repeat the problem. Screenshots are helpful.
